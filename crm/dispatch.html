<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Диспетчерская · CRM</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#202237;background:#f5f5fa;font:15px/1.55 system-ui,sans-serif}header{border-bottom:1px solid #dedfeb;padding:17px max(20px,calc((100vw - 1180px)/2));display:flex;gap:12px;align-items:center;white-space:nowrap}.mark{color:#6241bf;font-size:22px}header span:last-child{color:#575c72;margin-left:auto}main{max-width:1180px;margin:48px auto;padding:0 20px}h1{font-size:clamp(28px,5vw,48px);letter-spacing:-.045em;margin:4px 0 20px}h2,p{margin:0}.label{color:#575c72;font-size:12px;letter-spacing:.09em;text-transform:uppercase}.desk{display:grid;grid-template-columns:minmax(260px, .85fr) minmax(0,1.4fr);border:1px solid #dedfeb;border-radius:16px;overflow:hidden;background:#ffffff}.left{border-right:1px solid #dedfeb}.head{padding:16px 20px;border-bottom:1px solid #dedfeb;color:#454a61}.row{width:100%;text-align:left;color:inherit;background:none;border:0;border-left:3px solid transparent;border-bottom:1px solid #ececf4;padding:14px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;cursor:pointer;font:inherit}.row:hover{background:#f5f3fc}.row[aria-pressed=true]{background:#eee8fc;border-left-color:#7652d1}.row small{color:#555b72}.row strong:nth-child(2){font-variant-numeric:tabular-nums}.row:focus-visible{outline:2px solid #6241bf;outline-offset:-4px}.detail{padding:clamp(20px,4vw,44px)}.detail h2{font-size:clamp(24px,4vw,38px);letter-spacing:-.035em;margin:6px 0 10px}.tag{color:#983d20}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;border-block:1px solid #dedfeb;margin:24px 0;padding:16px 0}.stats b{display:block;margin-top:4px}.next{background:#f4efff;border-left:3px solid #7652d1;padding:16px 18px;border-radius:4px 10px 10px 4px}.next p{margin-top:6px}.note{color:#575c72;margin-top:16px;font-size:13px}@media(max-width:700px){main{margin-top:24px}.desk{grid-template-columns:1fr}.left{border-right:0}.rows{max-height:225px;overflow:auto}.stats{grid-template-columns:repeat(2,1fr)}}

header{background:#ffffff}.desk{box-shadow:0 12px 36px #2521420a}.row[aria-pressed=true] strong{color:#432687}
</style>
<header><span class="mark" aria-hidden="true">◈</span><strong>Диспетчерская</strong><span>CRM заявок</span></header><main><div class="label">Заявки на автоматизацию</div><h1>С кем связаться сегодня</h1><div class="desk"><section class="left" aria-label="Очередь лидов"><div class="head" id="count"></div><div class="rows" id="rows"></div></section><section class="detail" id="detail" aria-label="Детали лида" aria-live="polite"></section></div><p class="note">Балл показывает приоритет обработки.</p></main>
<script type="application/json" id="data">__CRM_ROWS__</script><script>
const rows=JSON.parse(document.querySelector('#data').textContent).filter(r=>r[5]).sort((a,b)=>Number(b[4])-Number(a[4]));
const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const name=s=>s.replace(/^Демо\s+/i,'').replace(/^./,c=>c.toUpperCase());
const money=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽';
const list=document.querySelector('#rows'), detail=document.querySelector('#detail');
document.querySelector('#count').textContent='Активные · '+rows.length+'   /   Горячие · '+rows.filter(r=>r[5]==='Горячий').length;
list.innerHTML=rows.map(([id,n,source,budget,score,priority],i)=>'<button class="row" type="button" aria-pressed="false" data-i="'+i+'"><strong>'+e(name(n))+'</strong><strong>'+e(score)+'</strong><small>'+e(priority)+'</small><small>'+e(money(budget))+'</small></button>').join('');
function select(i){const [id,n,source,budget,score,priority,next]=rows[i];list.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));detail.innerHTML='<div class="label">Лид '+e(id)+'</div><h2>'+e(name(n))+'</h2><p class="tag">'+e(priority)+'</p><div class="stats"><div><span class="label">Балл</span><b>'+e(score)+' / 100</b></div><div><span class="label">Бюджет</span><b>'+e(money(budget))+'</b></div><div><span class="label">Источник</span><b>'+e(source)+'</b></div></div><div class="next"><div class="label">Следующий шаг</div><p>'+e(next || 'Рекомендация пока недоступна.')+'</p></div>';}
list.addEventListener('click',event=>{const button=event.target.closest('button[data-i]');if(button)select(Number(button.dataset.i));});if(rows.length)select(0);else detail.textContent='В очереди пока нет оценённых лидов.';
</script></html>
